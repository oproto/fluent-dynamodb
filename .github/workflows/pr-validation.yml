name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    outputs:
      changelog-modified: ${{ steps.check-changelog.outputs.modified }}
      changelog-valid: ${{ steps.check-changelog.outputs.valid }}
      skip-changelog: 'false'
      validation-message: ${{ steps.check-changelog.outputs.message }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Check changelog status (informational)
        id: check-changelog
        run: |
          # Get the list of changed files in this PR
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          if echo "$CHANGED_FILES" | grep -q "^CHANGELOG.md$"; then
            echo "modified=true" >> $GITHUB_OUTPUT
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "message=CHANGELOG.md was updated in this PR" >> $GITHUB_OUTPUT
            echo "✅ CHANGELOG.md was modified in this PR"
          else
            echo "modified=false" >> $GITHUB_OUTPUT
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "message=CHANGELOG.md was not updated (reminder: update before stable release)" >> $GITHUB_OUTPUT
            echo "ℹ️ CHANGELOG.md was not modified — this is fine, just remember to update it before a stable release"
          fi

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    needs: validate-pr

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    needs: build

  summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-pr, build, test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Aggregate validation results
        id: aggregate
        run: |
          # Collect job statuses
          VALIDATE_PR_STATUS="${{ needs.validate-pr.result }}"
          BUILD_STATUS="${{ needs.build.result }}"
          TEST_STATUS="${{ needs.test.result }}"
          
          # Determine overall status
          OVERALL_STATUS="success"
          
          if [ "$VALIDATE_PR_STATUS" != "success" ]; then
            OVERALL_STATUS="failure"
          fi
          
          if [ "$BUILD_STATUS" != "success" ]; then
            OVERALL_STATUS="failure"
          fi
          
          if [ "$TEST_STATUS" != "success" ]; then
            OVERALL_STATUS="failure"
          fi
          
          echo "overall-status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
          
          # Store individual statuses
          echo "validate-pr-status=$VALIDATE_PR_STATUS" >> $GITHUB_OUTPUT
          echo "build-status=$BUILD_STATUS" >> $GITHUB_OUTPUT
          echo "test-status=$TEST_STATUS" >> $GITHUB_OUTPUT
      
      - name: Generate PR comment
        id: generate-comment
        run: |
          # Create comment body
          cat > comment.md << 'EOF'
          ## 🔍 PR Validation Results
          
          ### Validation Checks
          
          | Check | Status | Details |
          |-------|--------|---------|
          | Changelog | ${{ needs.validate-pr.outputs.changelog-modified == 'true' && '✅ Updated' || 'ℹ️ Not updated' }} | ${{ needs.validate-pr.outputs.validation-message }} |
          | Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} | Build completed on all platforms |
          | Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} | Unit and integration tests executed |
          
          ### Overall Status
          
          ${{ steps.aggregate.outputs.overall-status == 'success' && '✅ **All validations passed!** This PR is ready for review.' || '❌ **Some validations failed.** Please review the details above and fix any issues.' }}
          
          ---
          
          <details>
          <summary>📋 Validation Details</summary>
          
          #### Changelog Status
          - Modified: ${{ needs.validate-pr.outputs.changelog-modified == 'true' && '✅ Yes' || 'ℹ️ No (remember to update before stable release)' }}
          
          #### Build Status
          - Status: ${{ needs.build.result }}
          - Platforms: ubuntu-latest, windows-latest, macos-latest
          
          #### Test Status
          - Status: ${{ needs.test.result }}
          - Unit Tests: Executed on all platforms
          - Integration Tests: Executed with DynamoDB Local
          
          </details>
          
          ---
          
          *This comment was automatically generated by the PR validation workflow.*
          EOF
          
          # Output the comment file path
          echo "comment-file=comment.md" >> $GITHUB_OUTPUT
      
      - name: Post PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('comment.md', 'utf8');
            
            // Find existing comment from this workflow
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🔍 PR Validation Results')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing PR comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new PR comment');
            }
      
      - name: Set final status check
        run: |
          OVERALL_STATUS="${{ steps.aggregate.outputs.overall-status }}"
          
          if [ "$OVERALL_STATUS" = "success" ]; then
            echo "✅ All PR validations passed"
            exit 0
          else
            echo "❌ PR validation failed"
            exit 1
          fi
